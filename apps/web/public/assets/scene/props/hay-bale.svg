<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- loose straw wisps on top -->
    <path d="M18,21 Q16,13 12,10" stroke="#C99143" stroke-width="2.5" fill="none"/>
    <path d="M30,21 Q30,12 28,8" stroke="#C99143" stroke-width="2.5" fill="none"/>
    <path d="M44,21 Q46,13 50,11" stroke="#C99143" stroke-width="2.5" fill="none"/>
    <!-- bale body -->
    <rect x="10" y="20" width="44" height="30" rx="9" fill="#E3B45C" stroke="#2B1B12" stroke-width="2.5"/>
    <!-- horizontal thatch lines -->
    <path d="M13,29 Q32,25 51,29" stroke="#C99143" stroke-width="2" fill="none"/>
    <path d="M12,37 Q32,33 52,37" stroke="#C99143" stroke-width="2" fill="none"/>
    <path d="M13,45 Q32,41 51,45" stroke="#C99143" stroke-width="2" fill="none"/>
    <!-- binding straps -->
    <rect x="22" y="20" width="4.5" height="30" fill="#C99143" stroke="#2B1B12" stroke-width="1.6"/>
    <rect x="37.5" y="20" width="4.5" height="30" fill="#C99143" stroke="#2B1B12" stroke-width="1.6"/>
    <!-- highlight -->
    <path d="M15,25 Q24,21.5 34,22.5" stroke="#F5D98B" stroke-width="2.2" fill="none" opacity="0.9"/>
  </g>
</svg>
