    <path d="M39,30 L40,32.2 L42.2,33.2 L40,34.2 L39,36.4 L38,34.2 L35.8,33.2 L38,32.2 Z" fill="#FFF6D8" stroke="#EDA614" stroke-width="1.2"/>
    <circle cx="14" cy="40" r="1.4" fill="#FFD766"/>
    <circle cx="37" cy="9" r="1.6" fill="#FFD766"/>
