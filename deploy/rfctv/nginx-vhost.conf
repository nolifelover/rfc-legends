# RFC Legends vhost on the rfctv box (D2). Cloudflare fronts this host with
# SSL "Full" (non-strict), which accepts the self-signed origin cert stored
# under /etc/nginx/ssl/rfclegends/ (generated by scripts/deploy-rfctv.sh).
# SSE (PocketBase realtime via /pb/) needs buffering off and long timeouts.
# Plain :80 stays as a fallback for a per-host Flexible rule.

server {
    listen 80;
    server_name rfclegends.rfcclub.app;

    # PocketBase direct: Next's /pb/ rewrite bakes its destination at build
    # time (the local 127.0.0.1:8091), which is wrong inside the container —
    # so /pb/ never reaches Next; nginx talks to the host-published PB port.
    location /pb/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name rfclegends.rfcclub.app;

    ssl_certificate /etc/nginx/ssl/rfclegends/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rfclegends/privkey.pem;

    location /pb/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
