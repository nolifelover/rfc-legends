    <!-- legendary golden staff -->
    <path d="M24,11 L24,45" stroke="#2B1B12" stroke-width="8.5"/>
    <path d="M24,11 L24,45" stroke="url(#gold)" stroke-width="5.5"/>
    <path d="M24,11 Q34,8 32,18" fill="none" stroke="#2B1B12" stroke-width="8.5"/>
