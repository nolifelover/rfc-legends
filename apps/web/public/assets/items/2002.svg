<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- folded mohorm robe -->
    <path d="M10,12 Q24,7 38,12 L38,30 Q24,35 10,30 Z" fill="#3F5FA8" stroke="#2B1B12" stroke-width="2.5"/>
    <!-- folded flap -->
    <path d="M38,12 Q42.5,14 42.5,20 L42.5,28 Q40,30.5 38,30 Z" fill="#2C4477" stroke="#2B1B12" stroke-width="2.2"/>
    <!-- collar V -->
    <path d="M19,12 L24,20 L29,12" fill="none" stroke="#2B1B12" stroke-width="2.2"/>
    <path d="M19.8,12 L24,18.6 L28.2,12 Z" fill="#2C4477"/>
    <!-- yantra grid, sacred geometry -->
    <rect x="20" y="22" width="8" height="8" fill="none" stroke="#FBE6B3" stroke-width="1.6"/>
    <path d="M20,22 L28,30 M28,22 L20,30" stroke="#FBE6B3" stroke-width="1.2"/>
    <path d="M24,19.5 L24,22 M24,30 L24,32.5 M17.5,26 L20,26 M28,26 L30.5,26" stroke="#FBE6B3" stroke-width="1.4"/>
    <circle cx="24" cy="26" r="1.1" fill="#FBE6B3"/>
    <!-- gold hem -->
    <path d="M10,30 Q24,35 38,30" fill="none" stroke="#EDA614" stroke-width="2.2"/>
    <!-- small sleeve fold line -->
    <path d="M10,12 Q8.5,21 10,30" stroke="#2C4477" stroke-width="1.6" fill="none"/>
    <!-- highlight -->
    <path d="M12,13.5 Q24,9.5 36,13.5" stroke="#6E8CC9" stroke-width="1.8" fill="none" opacity="0.9"/>
  </g>
</svg>
