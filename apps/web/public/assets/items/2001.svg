    <g stroke="#FFD766" stroke-width="2.6" opacity="0.95">
      <path d="M24,2 L24,5.5"/>
      <path d="M12,6 L14.5,8.5"/>
      <path d="M36,6 L33.5,8.5"/>
      <path d="M8,16 L11.5,16"/>
      <path d="M40,16 L36.5,16"/>
