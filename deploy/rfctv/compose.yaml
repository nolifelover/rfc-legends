# RFC Legends on the rfctv box (D2). Run from the synced repo root:
#   docker compose -f compose.yaml up -d --build
# Ports are bound to loopback only; the host nginx vhost proxies
# rfclegends.rfcclub.app -> 127.0.0.1:3100.
services:
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: ../deploy/rfctv/Dockerfile.pb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./pb_data_prod:/app/pb_data
    env_file:
      - ./apps/web/.env.production.local

  web:
    build:
      context: ./apps/web
      dockerfile: ../../deploy/rfctv/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - pocketbase
    env_file:
      - ./apps/web/.env.production.local
    # compose-level overrides win over the env file: inside the compose
    # network PocketBase is reachable by service name.
    environment:
      POCKETBASE_URL: http://pocketbase:8091
      APP_URL: https://rfclegends.rfcclub.app
      NEXT_PUBLIC_SITE_URL: https://rfclegends.rfcclub.app
