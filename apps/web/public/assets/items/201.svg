<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- rattan cane with hooked handle -->
    <path d="M10,42 L32,13" stroke="#2B1B12" stroke-width="8.5"/>
    <path d="M10,42 L32,13" stroke="#C89A5B" stroke-width="4.8"/>
    <path d="M32,13 Q45,9 42.5,22" fill="none" stroke="#2B1B12" stroke-width="8.5"/>
    <path d="M32,13 Q45,9 42.5,22" fill="none" stroke="#C89A5B" stroke-width="4.8"/>
    <!-- handle knob -->
    <circle cx="32.5" cy="12.5" r="3.2" fill="#C99143" stroke="#2B1B12" stroke-width="2.2"/>
    <!-- rattan binding bands across the shaft -->
    <path d="M14,35.2 L20,31.4" stroke="#8A6B4A" stroke-width="2.4"/>
    <path d="M19,29.4 L25,25.6" stroke="#8A6B4A" stroke-width="2.4"/>
    <path d="M24,23.6 L30,19.8" stroke="#8A6B4A" stroke-width="2.4"/>
    <!-- wrapped grip at the base -->
    <path d="M11.5,38 L14,40" stroke="#8A6B4A" stroke-width="2.4"/>
    <path d="M10,40.5 L12.5,42.7" stroke="#8A6B4A" stroke-width="2.4"/>
    <!-- highlight along the shaft -->
    <path d="M12,39 L31,15" stroke="#E8C48E" stroke-width="1.6" opacity="0.9"/>
  </g>
</svg>
