<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- spilled rice grains -->
    <ellipse cx="13" cy="43" rx="3" ry="1.8" transform="rotate(-14 13 43)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.6"/>
    <ellipse cx="20" cy="45" rx="3" ry="1.8" transform="rotate(10 20 45)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.6"/>
    <ellipse cx="31" cy="44" rx="3" ry="1.8" transform="rotate(-8 31 44)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.6"/>
    <!-- burlap sack -->
    <path d="M14,15 Q10,30 12,38 Q14,45 24,45 Q34,45 36,38 Q38,30 34,15 Z" fill="#EAD9A8" stroke="#2B1B12" stroke-width="2.5"/>
    <!-- gathered neck -->
    <path d="M15,15 Q18,8 22,12 Q24,7 27,12 Q30,8 33,15 Z" fill="#EAD9A8" stroke="#2B1B12" stroke-width="2.2"/>
    <path d="M14.5,17 Q24,21.5 33.5,17" stroke="#B08A54" stroke-width="2.4" fill="none"/>
    <circle cx="33" cy="18" r="2" fill="#B08A54" stroke="#2B1B12" stroke-width="1.5"/>
    <!-- grain emblem -->
    <ellipse cx="21.5" cy="29" rx="2.6" ry="4.4" transform="rotate(-18 21.5 29)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.7"/>
    <ellipse cx="27" cy="28" rx="2.6" ry="4.4" transform="rotate(8 27 28)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.7"/>
    <ellipse cx="24.3" cy="34.5" rx="2.6" ry="4.4" transform="rotate(-5 24.3 34.5)" fill="#F2C94C" stroke="#2B1B12" stroke-width="1.7"/>
    <!-- weave stitches -->
    <path d="M16,21 L16.5,27 M32,21 L31.5,27" stroke="#C9B273" stroke-width="1.4"/>
  </g>
</svg>
